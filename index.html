<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Vestiaire Club</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,700;1,800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout : appli mobile d'abord, bandeau dégradé en tête, cartes à grosses icônes colorées par équipe, barre d'onglets en bas, tableau d'affichage pour le LIVE. */
:root{
  --bg:#F2F4FF; --surface:#FFFFFF; --surface-2:#ECEFFD; --ink:#121633; --muted:#5B6285; --line:#DDE2F6;
  --accent:#2B59FF; --accent-soft:#E2E8FF; --accent-ink:#FFFFFF;
  --present:#10A562; --present-soft:#D7F5E7; --absent:#EE3348; --absent-soft:#FFE0E4;
  --pending:#8A90AE; --pending-soft:#ECEEF7; --live:#FF5A1F; --live-soft:#FFE6DB;
  --board:#0F1438; --board-ink:#FFFFFF; --board-digit:#FFD23F;
  --hot:#FF6A3D; --sun:#FFC93C; --violet:#7B5CFF;
  --grad:linear-gradient(118deg,#2B59FF 0%,#6C4DFF 58%,#FF6A3D 125%);
  --shadow:0 1px 0 rgb(30 40 120 / .06),0 12px 30px -18px rgb(30 40 120 / .45);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#090D22; --surface:#141A3A; --surface-2:#1B2248; --ink:#EEF1FF; --muted:#9AA2C9; --line:#283163;
  --accent:#7090FF; --accent-soft:#1F2A66; --accent-ink:#090D22;
  --present:#2FD488; --present-soft:#0F3A2A; --absent:#FF5A6B; --absent-soft:#43161F;
  --pending:#7E86AD; --pending-soft:#20274D; --live:#FF7A45; --live-soft:#45220F;
  --board:#04071A; --board-ink:#FFFFFF; --board-digit:#FFD23F;
  --hot:#FF7A52; --sun:#FFD23F; --violet:#9B83FF;
  --grad:linear-gradient(118deg,#3150E6 0%,#6544EA 58%,#E35A30 125%);
  --shadow:0 1px 0 rgb(0 0 0 / .3),0 14px 30px -18px rgb(0 0 0 / .8); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#090D22; --surface:#141A3A; --surface-2:#1B2248; --ink:#EEF1FF; --muted:#9AA2C9; --line:#283163;
  --accent:#7090FF; --accent-soft:#1F2A66; --accent-ink:#090D22;
  --present:#2FD488; --present-soft:#0F3A2A; --absent:#FF5A6B; --absent-soft:#43161F;
  --pending:#7E86AD; --pending-soft:#20274D; --live:#FF7A45; --live-soft:#45220F;
  --board:#04071A; --board-ink:#FFFFFF; --board-digit:#FFD23F;
  --hot:#FF7A52; --sun:#FFD23F; --violet:#9B83FF;
  --grad:linear-gradient(118deg,#3150E6 0%,#6544EA 58%,#E35A30 125%);
  --shadow:0 1px 0 rgb(0 0 0 / .3),0 14px 30px -18px rgb(0 0 0 / .8); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}
.label{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-size:12.5px;font-weight:600;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.crest{width:36px;height:36px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:16px;flex:none}
.top h1{font-size:21px;line-height:1.1}
.top .sub{font-size:13px;color:var(--muted)}
.role{margin-left:auto;font-family:var(--f-display);font-weight:600;font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;padding:4px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}

main{padding-block:18px 110px}
.section{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:18px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav .wrap{display:grid;grid-template-columns:repeat(4,1fr);padding-block:6px}
.nav button{background:none;border:0;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-family:var(--f-display);font-weight:600;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;border-radius:10px;position:relative}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="true"]{color:var(--accent)}
.nav .dot{position:absolute;top:4px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--live);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.nav .dot,.live-tag::before{animation:none}}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:10px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:6px 10px;font-size:13px}
.btn.danger{color:var(--absent)}
.btn.danger[data-armed]{background:var(--absent);color:#fff;border-color:var(--absent)}
.btn.live{background:var(--live);border-color:var(--live);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}

/* segmented */
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;padding:7px 10px;border-radius:8px;font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}

/* cards & lists */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0}
.item .name{font-weight:600}
.item .meta{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.pick{cursor:pointer;font-size:13.5px;padding:6px 12px;color:var(--ink);background:var(--surface)}
.chip.pick:hover{border-color:var(--accent)}
.chip.pick[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.club{background:var(--live-soft);border-color:transparent;color:var(--live)}
.chip.team{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px;flex:none}

/* day headings + events */
.day{font-family:var(--f-display);font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:4px 2px 0}
.day.today{color:var(--accent)}
.ev{display:grid;grid-template-columns:58px 1fr;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left;width:100%}
.ev:hover{border-color:var(--accent)}
.ev .when-old{display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:1px solid var(--line);padding-right:12px}
.ev .when .t{font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1}
.ev .when .d{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:3px}
.ev .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.ev .title{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.15}
.ev .subtitle{color:var(--muted);font-size:14px;margin-top:-4px}
.ev.is-live{border-color:var(--live);box-shadow:inset 3px 0 0 var(--live)}
.live-tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:700;font-size:12.5px;letter-spacing:.1em;color:var(--live);text-transform:uppercase}
.live-tag::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--live);animation:pulse 1.4s infinite}
.mini-score{font-family:var(--f-display);font-weight:700;font-size:17px;color:var(--ink)}

/* presence bar */
.pbar{display:flex;height:6px;border-radius:99px;overflow:hidden;background:var(--pending-soft)}
.pbar span{display:block}
.pcount{display:flex;gap:12px;font-size:13px;font-weight:600}
.pcount .p{color:var(--present)} .pcount .a{color:var(--absent)} .pcount .n{color:var(--pending)}

/* response buttons */
.resp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.resp .who{font-weight:600;font-size:14px;margin-right:auto}
.rbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 13px;font-weight:600;font-size:13.5px}
.rbtn.present[aria-pressed="true"]{background:var(--present);border-color:var(--present);color:#fff}
.rbtn.absent[aria-pressed="true"]{background:var(--absent);border-color:var(--absent);color:#fff}
.rbtn.present:not([aria-pressed="true"]){color:var(--present)}
.rbtn.absent:not([aria-pressed="true"]){color:var(--absent)}
.status{font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap}
.status.present{background:var(--present-soft);color:var(--present)}
.status.absent{background:var(--absent-soft);color:var(--absent)}
.status.none{background:var(--pending-soft);color:var(--pending)}

/* scoreboard */
.board{background:var(--board);color:var(--board-ink);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.board .head{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;opacity:.85}
.board .teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.board .side{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0;text-align:center}
.board .side .tn{font-family:var(--f-display);font-weight:600;font-size:16px;text-transform:uppercase;letter-spacing:.06em;overflow-wrap:anywhere}
.board .digits{font-family:var(--f-display);font-weight:700;font-size:64px;line-height:.9;color:var(--board-digit);font-variant-numeric:tabular-nums;text-shadow:0 0 18px rgb(255 201 74 / .25)}
.board .sep{font-family:var(--f-display);font-size:40px;opacity:.5}
.board .ctl{display:flex;gap:8px}
.board .ctl button{width:42px;height:42px;border-radius:10px;border:1px solid rgb(255 255 255 / .2);background:rgb(255 255 255 / .08);color:var(--board-ink);font-size:22px;font-weight:700}
.board .ctl button:hover{background:rgb(255 255 255 / .16)}
.board .clock{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.08em;color:var(--board-digit)}
.board .foot{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* sheet & modal */
.overlay{position:fixed;inset:0;z-index:40;background:rgb(6 12 20 / .5);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.overlay{align-items:center}}
.panel{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.panel{border-radius:18px}}
.panel-head{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px;padding:14px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));z-index:2}
.panel-head h2{font-size:23px;line-height:1.1}
.panel-head .x{margin-left:auto;border:0;background:var(--surface-2);width:34px;height:34px;border-radius:50%;font-size:18px;flex:none}
.panel-body{padding:16px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}

/* forms */
.field{display:flex;flex-direction:column;gap:5px}
.field > span{font-size:13px;font-weight:600;color:var(--muted)}
.input,select.input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:15px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}
.checks{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--surface);max-height:260px;overflow:auto}
.checks label{display:flex;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--line)}
.checks label:first-child{border-top:0}
.checks input{width:18px;height:18px;accent-color:var(--accent)}
.toggle{display:flex;gap:10px;align-items:center;font-weight:600}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
.err{color:var(--absent);font-weight:600;font-size:14px}
.empty{text-align:center;padding:28px 16px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}

/* login */
.login{min-height:100%;display:flex;align-items:center;padding-block:40px}
.login .wrap{max-width:440px;width:100%;display:flex;flex-direction:column;gap:20px}
.login h1{font-size:44px;line-height:1}
.login .crest{width:52px;height:52px;font-size:22px;border-radius:13px}
.demo button{text-align:left;width:100%;background:var(--surface);border:0;border-top:1px solid var(--line);padding:11px 14px;display:flex;gap:10px;align-items:center}
.demo button:first-child{border-top:0}
.demo button:hover{background:var(--surface-2)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-weight:600;font-size:14px;z-index:60}

/* ===== Habillage « punchy » ===== */
body::before{background:#2B59FF}
h1,h2,h3{font-weight:800;font-style:italic;text-transform:uppercase;letter-spacing:.005em}
.top{background:var(--grad);border:0;color:#fff;box-shadow:0 10px 30px -16px rgb(43 89 255 / .8)}
.top .wrap{padding-block:12px}
.top .crest{width:46px;height:46px;border-radius:15px;font-size:20px;background:#fff;color:#2B59FF;font-style:italic;box-shadow:0 6px 16px -6px rgb(0 0 0 / .35)}
.top h1{font-size:25px;color:#fff}
.top .sub{color:rgb(255 255 255 / .82)}
.role{background:rgb(255 255 255 / .2);color:#fff;backdrop-filter:blur(4px)}
main{padding-block:22px 120px}
.page-title{display:flex;align-items:center;gap:14px;min-width:0}
.page-title .pi{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;color:#fff;background:var(--tc,var(--accent));box-shadow:0 10px 22px -10px var(--tc,var(--accent));flex:none;transform:rotate(-4deg)}
.page-title .pi svg{width:32px;height:32px}
.page-title h2{font-size:34px;line-height:.95}
.page-title .ps{font-size:14px;color:var(--muted);font-weight:500}
.nav{border-top:0;box-shadow:0 -10px 30px -18px rgb(30 40 120 / .5)}
.nav .wrap{padding-block:6px 4px}
.nav button{gap:3px;padding:4px 2px;font-size:12px}
.nav button .ni{width:52px;height:36px;border-radius:14px;display:grid;place-items:center;transition:background .2s,transform .2s}
.nav button svg{width:28px;height:28px}
.nav button[aria-current="true"]{color:var(--accent)}
.nav button[aria-current="true"] .ni{background:var(--accent);color:#fff;transform:translateY(-2px);box-shadow:0 8px 16px -8px var(--accent)}
.nav .dot{top:2px;right:calc(50% - 26px);width:11px;height:11px;border:2px solid var(--surface)}
.btn{border-radius:14px;font-weight:700;border-width:1.5px}
.btn.primary{background:var(--grad);border:0;color:#fff;box-shadow:0 10px 20px -12px #2B59FF;padding:10px 16px}
.btn.primary:hover{filter:brightness(1.08)}
.btn.live{box-shadow:0 10px 20px -12px var(--live)}
.card,.list{border:0;box-shadow:var(--shadow);border-radius:var(--r)}
.ev{border:0;box-shadow:var(--shadow);border-radius:var(--r);grid-template-columns:64px 1fr;padding:14px;transition:transform .15s,box-shadow .15s;cursor:pointer}
.ev:hover{transform:translateY(-2px);border-color:transparent}
.ev .evi{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;color:#fff;background:var(--tc);box-shadow:0 10px 20px -10px var(--tc);position:relative}
.ev .evi svg{width:36px;height:36px}
.ev .evi .rep{position:absolute;right:-5px;bottom:-5px;width:22px;height:22px;border-radius:50%;background:var(--surface);color:var(--tc);display:grid;place-items:center;font-size:13px;font-weight:800;box-shadow:0 2px 6px rgb(0 0 0 / .2)}
.ev .top-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ev .time{font-family:var(--f-display);font-weight:800;font-size:20px;line-height:1;color:var(--tc)}
.ev .title{font-size:22px;font-weight:800;font-style:italic;text-transform:uppercase;line-height:1.05}
.ev.is-live{box-shadow:0 0 0 2.5px var(--live),var(--shadow)}
.chip{border-radius:99px;font-weight:700}
.chip.team{background:color-mix(in srgb,var(--tc,var(--accent)) 15%,transparent);color:var(--tc,var(--accent))}
.chip.club{background:var(--hot);color:#fff}
.avatar{background:var(--ac,var(--accent));color:#fff;width:40px;height:40px;font-size:16px;font-style:italic;border-radius:14px}
.day{font-size:18px;font-style:italic;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:8px}
.day::after{content:"";flex:1;height:3px;border-radius:3px;background:var(--line)}
.day.today{color:var(--accent)}
.day.today::after{background:var(--grad)}
.seg{border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:16px;padding:4px}
.seg button{border-radius:12px;font-style:italic;font-weight:800}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff;box-shadow:0 6px 14px -8px var(--accent)}
.rbtn{padding:8px 16px;font-size:14.5px;border-width:2px;font-weight:700}
.rbtn.present[aria-pressed="true"]::before{content:"✓ "}
.rbtn.absent[aria-pressed="true"]::before{content:"✕ "}
.pbar{height:9px}
.status{padding:4px 11px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px}
.tile{border:0;border-radius:20px;padding:14px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--surface);box-shadow:var(--shadow);font-family:var(--f-display);font-weight:800;font-style:italic;text-transform:uppercase;font-size:15px;color:var(--ink);transition:transform .15s}
.tile:hover{transform:translateY(-2px)}
.tile .ti{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;color:#fff;background:var(--tc)}
.tile .ti svg{width:30px;height:30px}
.tile .n{font-size:12.5px;font-style:normal;font-weight:600;color:var(--muted);text-transform:none;margin-top:-6px}
.tile[aria-pressed="true"]{background:var(--tc);color:#fff;box-shadow:0 12px 24px -12px var(--tc)}
.tile[aria-pressed="true"] .ti{background:rgb(255 255 255 / .22)}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* =====================================================================
   CONFIGURATION SUPABASE — à remplir (Supabase > Project Settings > API)
   ===================================================================== */
const SUPABASE_URL='https://tgsridrqrygxxzoynupc.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRnc3JpZHJxcnlneHh6b3ludXBjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0MDg2MTYsImV4cCI6MjEwNzk4NDYxNn0.68OuJLIqHR90i64DNctXxmtge1lbjN81iyGA5UPaXN0';
/* ===================================================================== */
const CONFIGURED=!/VOTRE/.test(SUPABASE_URL+SUPABASE_ANON_KEY);
const sb=CONFIGURED&&window.supabase?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;

/* ---------- Stockage ---------- */
const uid=()=>crypto.randomUUID();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const low=s=>String(s||'').trim().toLowerCase();

const DEFAULT_TITLES=['Entraînement','Match de championnat','Match de coupe','Match amical','Tournoi','Stage','Réunion parents'];

const emptyState=()=>({club:{name:'Espace club',short:'',sport:'football',sportName:''},titles:[...DEFAULT_TITLES],users:[],champs:[],teams:[],players:[],events:[],validations:{}});
let S=emptyState();
let me=null;
const ui={tab:'cal',clubSec:'teams',calMode:'up',teamFilter:'all',sheet:null,loginErr:'',loginStep:'email',loginEmail:'',loginMode:'link',busy:false,booting:true};

/* ---------- Base de données (Supabase) ---------- */
const PK={club:['id'],members:['id'],championships:['id'],teams:['id'],players:['id'],player_parents:['player_id','email'],events:['id'],responses:['event_id','player_id']};
const ORDER=['club','members','championships','teams','players','player_parents','events','responses'];
let base=null, chain=Promise.resolve(), reloadTimer=null, channel=null;

function fromDb(r){
  const st=emptyState();
  const c=r.club[0];
  if(c){st.club={name:c.name,short:c.short,sport:c.sport,sportName:c.sport_name||''};st.titles=c.titles||[]}
  st.users=r.members.map(m=>({id:m.id,email:m.email,name:m.name,role:m.role}));
  st.champs=r.championships.map(x=>({id:x.id,name:x.name,season:x.season||''}));
  st.teams=r.teams.map(t=>({id:t.id,name:t.name,category:t.category||'',coachIds:t.coach_ids||[],champIds:t.champ_ids||[]}));
  st.players=r.players.map(p=>({id:p.id,first:p.first_name,last:p.last_name,birth:p.birth||'',teamId:p.team_id,parentEmails:[],phones:{}}));
  const byId=Object.fromEntries(st.players.map(p=>[p.id,p]));
  [...r.player_parents].sort((a,b)=>a.position-b.position).forEach(pp=>{
    const p=byId[pp.player_id];if(!p)return;
    p.parentEmails.push(pp.email);p.phones[pp.email]=pp.phone||'';
    if(pp.state!=='pending'){(st.validations[pp.email]=st.validations[pp.email]||{})[p.id]=pp.state}
  });
  st.events=r.events.map(e=>({id:e.id,teamId:e.team_id,createdBy:e.created_by,title:e.title,subtitle:e.subtitle||'',opponent:e.opponent||'',start:e.start_at,
    askPresence:e.ask_presence,convoked:e.convoked||[],seriesId:e.series_id,repeat:e.repeat,responses:{},
    live:{status:e.live_status,us:e.score_us,them:e.score_them,startedAt:e.live_started_at}}));
  const evById=Object.fromEntries(st.events.map(e=>[e.id,e]));
  r.responses.forEach(x=>{if(evById[x.event_id])evById[x.event_id].responses[x.player_id]=x.status});
  return st;
}
function toRows(){
  return {
    club:[{id:1,name:S.club.name,short:S.club.short,sport:S.club.sport,sport_name:S.club.sportName||null,titles:S.titles}],
    members:S.users.map(u=>({id:u.id,email:low(u.email),name:u.name,role:u.role})),
    championships:S.champs.map(c=>({id:c.id,name:c.name,season:c.season||null})),
    teams:S.teams.map(t=>({id:t.id,name:t.name,category:t.category||null,coach_ids:t.coachIds,champ_ids:t.champIds})),
    players:S.players.map(p=>({id:p.id,first_name:p.first,last_name:p.last,birth:p.birth||null,team_id:p.teamId||null})),
    player_parents:S.players.flatMap(p=>p.parentEmails.map((m,i)=>({player_id:p.id,email:low(m),phone:(p.phones||{})[low(m)]||'',state:(S.validations[low(m)]||{})[p.id]||'pending',position:i}))),
    events:S.events.map(e=>({id:e.id,team_id:e.teamId||null,created_by:e.createdBy||null,title:e.title,subtitle:e.subtitle||null,opponent:e.opponent||null,
      start_at:new Date(e.start).toISOString(),ask_presence:!!e.askPresence,convoked:e.convoked,series_id:e.seriesId||null,repeat:e.repeat||null,
      live_status:e.live.status,score_us:e.live.us,score_them:e.live.them,live_started_at:e.live.startedAt?new Date(e.live.startedAt).toISOString():null})),
    responses:S.events.flatMap(e=>Object.entries(e.responses).filter(([,v])=>v).map(([pid,v])=>({event_id:e.id,player_id:pid,status:v})))
  };
}
async function loadAll(){
  const res=await Promise.all(ORDER.map(t=>sb.from(t).select('*')));
  const err=res.find(x=>x.error);if(err)throw err.error;
  const r={};ORDER.forEach((t,i)=>r[t]=res[i].data||[]);
  S=fromDb(r);base=toRows();
}
async function pushDiff(){
  if(!me||!base)return;
  const cur=toRows();
  if(isParent()){base=cur;return}            // les parents écrivent via des fonctions dédiées
  for(const t of ORDER){
    const key=r=>PK[t].map(c=>r[c]).join('|');
    const old=new Map(base[t].map(r=>[key(r),JSON.stringify(r)]));
    let up=cur[t].filter(r=>old.get(key(r))!==JSON.stringify(r));
    if(!up.length)continue;
    if(t==='player_parents')up=up.map(({state,...r})=>r); // la confirmation appartient au parent
    const {error}=await sb.from(t).upsert(up,{onConflict:PK[t].join(',')});
    if(error)throw error;
  }
  for(const t of [...ORDER].reverse()){
    const key=r=>PK[t].map(c=>r[c]).join('|');
    const now=new Set(cur[t].map(key));
    const gone=base[t].filter(r=>!now.has(key(r)));
    if(!gone.length)continue;
    if(PK[t].length===1){const {error}=await sb.from(t).delete().in(PK[t][0],gone.map(r=>r[PK[t][0]]));if(error)throw error}
    else for(const r of gone){const m={};PK[t].forEach(c=>m[c]=r[c]);const {error}=await sb.from(t).delete().match(m);if(error)throw error}
  }
  base=cur;
}
function dbError(e){
  console.error(e);
  const msg=/row-level security|permission/i.test(e.message||'')?"Vous n'avez pas les droits pour cette modification.":(e.message||'Erreur réseau');
  toast('⚠️ '+msg+' Données rechargées.');
  return loadAll().then(render).catch(()=>{});
}
const save=()=>{chain=chain.then(pushDiff).catch(dbError)};
function scheduleReload(){
  clearTimeout(reloadTimer);
  reloadTimer=setTimeout(()=>{if(document.getElementById('modal').innerHTML){scheduleReload();return}chain=chain.then(loadAll).then(()=>{identify();render()}).catch(e=>console.error(e))},350);
}
function parentCall(fn,args){
  chain=chain.then(async()=>{const {error}=await sb.rpc(fn,args);if(error)throw error;await loadAll();identify();render()}).catch(dbError);
}
function identify(){
  if(!me)return;
  const email=low(me.email);
  const u=S.users.find(x=>low(x.email)===email);
  if(u)me={role:u.role,id:u.id,email,name:u.name};
  else if(S.players.some(p=>hasParent(p,email)))me={role:'parent',email,name:'Parent'};
  else me={role:'unknown',email,name:''};
}
async function enter(email){
  me={role:'unknown',email:low(email),name:''};ui.booting=true;render();
  try{await loadAll()}catch(e){ui.booting=false;ui.loginErr='Impossible de charger les données : '+e.message;me=null;render();return}
  identify();ui.booting=false;ui.tab='cal';
  if(!channel){channel=sb.channel('club-live').on('postgres_changes',{event:'*',schema:'public'},scheduleReload).subscribe()}
  render();
}
async function boot(){
  if(!sb){ui.booting=false;render();return}
  sb.auth.onAuthStateChange((evt,session)=>{
    if(evt==='SIGNED_IN'&&session&&(!me||low(me.email)!==low(session.user.email)))enter(session.user.email);
    if(evt==='SIGNED_OUT'){me=null;S=emptyState();base=null;render()}
  });
  const {data:{session}}=await sb.auth.getSession();
  if(session)await enter(session.user.email);else{ui.booting=false;render()}
}
const TKEY='vestiaire_theme';
let theme=(()=>{try{return localStorage.getItem(TKEY)||'clean'}catch(e){return 'clean'}})();
const applyTheme=()=>document.documentElement.classList.toggle('clean',theme==='clean');
applyTheme();

/* ---------- Requêtes ---------- */
const team=id=>S.teams.find(t=>t.id===id);
const player=id=>S.players.find(p=>p.id===id);
const user=id=>S.users.find(u=>u.id===id);
const champ=id=>S.champs.find(c=>c.id===id);
const ev=id=>S.events.find(e=>e.id===id);
const fullName=p=>p?`${p.first} ${p.last}`:'';
const initials=s=>s.split(/\s+/).map(w=>w[0]||'').join('').slice(0,2).toUpperCase();
const isAdmin=()=>me&&me.role==='admin';
const isCoach=()=>me&&me.role==='coach';
const isParent=()=>me&&me.role==='parent';
const hasParent=(p,email)=>(p.parentEmails||[]).some(e=>low(e)===low(email));
const linkState=(p,email)=>(S.validations[low(email)]||{})[p.id]; // 'ok' | 'no' | undefined
const linkedKids=()=>S.players.filter(p=>hasParent(p,me.email));
const pendingKids=()=>linkedKids().filter(p=>!linkState(p,me.email));
const children=()=>linkedKids().filter(p=>linkState(p,me.email)==='ok');
const isStaff=()=>isAdmin()||isCoach();
const phoneOf=(p,m)=>(p.phones||{})[low(m)]||'';
function myTeamIds(){
  if(isAdmin())return S.teams.map(t=>t.id);
  if(isCoach())return S.teams.filter(t=>t.coachIds.includes(me.id)).map(t=>t.id);
  return [...new Set(children().map(c=>c.teamId).filter(Boolean))];
}
const canManage=teamId=>isAdmin()||(isCoach()&&team(teamId)?.coachIds.includes(me.id));
const teamPlayers=tid=>S.players.filter(p=>p.teamId===tid).sort((a,b)=>a.last.localeCompare(b.last));
function evStatus(e){
  if(e.live.status==='live')return 'live';
  if(e.live.status==='done')return 'done';
  return new Date(e.start)>Date.now()?'up':'started';
}
function isPast(e){const s=evStatus(e);if(s==='live')return false;if(s==='done')return true;return new Date(e.start).getTime()<Date.now()-12*3600e3}
function counts(e){let p=0,a=0;e.convoked.forEach(id=>{const r=e.responses[id];if(r==='present')p++;else if(r==='absent')a++});return{p,a,n:e.convoked.length-p-a,t:e.convoked.length}}

/* ---------- Formats ---------- */
const fmt=(o,d)=>new Intl.DateTimeFormat('fr-FR',o).format(new Date(d));
const fTime=d=>fmt({hour:'2-digit',minute:'2-digit'},d);
const fDayLong=d=>fmt({weekday:'long',day:'numeric',month:'long'},d);
const fDayShort=d=>fmt({weekday:'short',day:'numeric',month:'short'},d);
const dayKey=d=>{const x=new Date(d);return x.getFullYear()+'-'+x.getMonth()+'-'+x.getDate()};
const toLocalInput=d=>{const x=new Date(d);const z=n=>String(n).padStart(2,'0');return `${x.getFullYear()}-${z(x.getMonth()+1)}-${z(x.getDate())}T${z(x.getHours())}:${z(x.getMinutes())}`};
const fBirth=d=>d?fmt({day:'numeric',month:'long',year:'numeric'},d+'T12:00'):'—';

function render(){
  const app=document.getElementById('app');
  if(!sb){app.innerHTML=setupView();return}
  if(ui.booting){app.innerHTML=`<div class="login"><div class="wrap"><div class="card" style="text-align:center">Chargement du club…</div></div></div>`;return}
  if(!me){app.innerHTML=loginView();renderSheet();return}
  if(me.role==='unknown'){app.innerHTML=unknownView();return}
  if(isParent()&&pendingKids().length){app.innerHTML=validateView();renderSheet();return}
  const tabs=isAdmin()?[['cal','Calendrier',I.cal],['live','Live',I.live],['club','Club',I.club],['me','Compte',I.me]]
           :isCoach()?[['cal','Calendrier',I.cal],['live','Live',I.live],['team','Équipe',I.team],['me','Compte',I.me]]
           :[['cal','Calendrier',I.cal],['live','Live',I.live],['kids','Enfant',I.child],['me','Compte',I.me]];
  if(!tabs.some(t=>t[0]===ui.tab))ui.tab='cal';
  const hasLive=visibleEvents().some(e=>evStatus(e)==='live');
  const roleLbl={admin:'Admin',coach:'Coach',parent:'Parent'}[me.role];
  let body='';
  if(ui.tab==='cal')body=calView();
  else if(ui.tab==='live')body=liveView();
  else if(ui.tab==='club')body=clubView();
  else if(ui.tab==='team')body=coachTeamView();
  else if(ui.tab==='kids')body=kidsView();
  else body=accountView();
  app.innerHTML=`
  <header class="top"><div class="wrap">
    <div class="crest">${esc(S.club.short||initials(S.club.name))}<span class="crest-sport" title="${esc(sportLabel())}">${sportIcon()}</span></div>
    <div style="min-width:0"><h1>${esc(S.club.name)}</h1><div class="sub">${esc(me.name||me.email)}</div></div>
    <span class="role">${roleLbl}</span>
  </div></header>
  <main><div class="wrap">${body}</div></main>
  <nav class="nav"><div class="wrap">${tabs.map(([k,l,ic])=>`<button data-a="tab" data-tab="${k}" aria-current="${ui.tab===k}"><span class="ni">${ic}</span>${l}${k==='live'&&hasLive?'<i class="dot"></i>':''}</button>`).join('')}</div></nav>`;
  renderSheet();
}

async function changePassword(f){
  const a=f.pw1.value,b=f.pw2.value,err=document.getElementById('pwErr');
  const fail=m=>{err.textContent=m;err.hidden=false};
  if(a.length<8)return fail('8 caractères minimum.');
  if(a!==b)return fail('Les deux mots de passe sont différents.');
  if(a==='admin123')return fail('Choisissez un mot de passe différent du mot de passe de départ.');
  const {error}=await sb.auth.updateUser({password:a});
  if(error)return fail(error.message);
  f.reset();err.hidden=true;toast('Mot de passe enregistré');
}

      ${ui.loginErr?`<div class="err">${esc(ui.loginErr)}</div>`:''}

async function login(email){
  email=low(email);ui.loginEmail=email;ui.loginErr='';ui.busy=true;render();
  try{
    const {data:known,error:e1}=await sb.rpc('is_known_email',{p_email:email});
    if(e1)throw e1;
    if(!known){ui.loginErr="Cette adresse n'est pas connue du club. Vérifiez l'orthographe ou demandez au club de l'ajouter à la fiche de votre enfant.";return}
    const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.href.split('#')[0].split('?')[0]}});
    if(error)throw error;
    ui.loginStep='sent';
  }catch(e){ui.loginErr=/rate|seconds/i.test(e.message||'')?"Trop de demandes. Patientez une minute avant de redemander un lien.":(e.message||'Erreur réseau')}
  finally{ui.busy=false;render()}
}
async function loginPassword(email,password){
  email=low(email);ui.loginEmail=email;ui.loginErr='';ui.busy=true;render();
  const {error}=await sb.auth.signInWithPassword({email,password});
  ui.busy=false;
  if(error){ui.loginErr=/invalid/i.test(error.message)?'E-mail ou mot de passe incorrect.':error.message;render()}
}
async function verifyCode(code){
  ui.busy=true;ui.loginErr='';render();
  const {error}=await sb.auth.verifyOtp({email:ui.loginEmail,token:code.trim(),type:'email'});
  ui.busy=false;
  if(error){ui.loginErr='Code invalide ou expiré.';render()}
}

  else if(st==='done'&&(e.live.startedAt))extra=`<div class="row"><span class="chip">Terminé</span><span class="mini-score num">${e.live.us} – ${e.live.them}</span></div>`;
  else if(st==='started')extra=`<div class="row"><span class="chip">Commencé</span></div>`;
  return `<div class="ev ${st==='live'?'is-live':''}" style="--tc:${evColor(e)}" role="button" tabindex="0" data-a="open-ev" data-id="${e.id}">
    <div class="evi">${evIcon(e.title)}${e.seriesId?'<span class="rep" title="Événement répété">↻</span>':''}</div>
    <div class="body">
      <div class="top-line"><span class="time num">${fTime(e.start)}</span>${scopeChip(e)}${e.askPresence?'':'<span class="chip">Sans réponse demandée</span>'}</div>
      <div class="title">${esc(e.title)}</div>
      ${e.subtitle?`<div class="subtitle">${esc(e.subtitle)}</div>`:''}
      ${extra}
      ${e.askPresence&&!isParent()?presenceBar(e):''}
      ${e.askPresence&&kids.length&&st==='up'?kids.map(k=>respRow(e,k)).join(''):''}
      ${e.askPresence&&kids.length&&st!=='up'?kids.map(k=>`<div class="resp"><span class="who">${esc(k.first)}</span>${statusPill(e.responses[k.id])}</div>`).join(''):''}
      ${isParent()&&!kids.length&&e.askPresence?'<span class="muted" style="font-size:13px">Votre enfant n\'est pas convoqué.</span>':''}
    </div></div>`;
}
function respRow(e,k){const r=e.responses[k.id];return `<div class="resp"><span class="who">${esc(k.first)}</span>
  <button class="rbtn present" data-a="respond" data-ev="${e.id}" data-pl="${k.id}" data-v="present" aria-pressed="${r==='present'}">Présent</button>
  <button class="rbtn absent" data-a="respond" data-ev="${e.id}" data-pl="${k.id}" data-v="absent" aria-pressed="${r==='absent'}">Absent</button></div>`}
const statusPill=r=>r==='present'?'<span class="status present">Présent</span>':r==='absent'?'<span class="status absent">Absent</span>':'<span class="status none">Pas répondu</span>';

/* ---------- Fiche événement ---------- */
function renderSheet(){
  const root=document.getElementById('sheet');
  const e=ui.sheet&&ev(ui.sheet);
  if(!me||!e){root.innerHTML='';return}
  const st=evStatus(e),manage=canManageEv(e);
  const conv=e.convoked.map(player).filter(Boolean).sort((a,b)=>a.last.localeCompare(b.last));
  const grp={present:[],absent:[],none:[]};conv.forEach(p=>grp[e.responses[p.id]||'none'].push(p));
  const myKids=isParent()?children().map(c=>c.id):[];
  const plRow=p=>`<div class="item">${av(fullName(p))}<div class="grow"><div class="name">${esc(fullName(p))}${myKids.includes(p.id)?' <span class="chip team">Votre enfant</span>':''}</div>${isStaff()?p.parentEmails.filter(m=>phoneOf(p,m)).map(m=>`<div class="meta num">${esc(phoneOf(p,m))} · ${esc(m)}</div>`).join(''):''}</div>
    ${(manage||(myKids.includes(p.id)&&st==='up'))?`<button class="rbtn present" data-a="respond" data-ev="${e.id}" data-pl="${p.id}" data-v="present" aria-pressed="${e.responses[p.id]==='present'}" aria-label="Présent">P</button><button class="rbtn absent" data-a="respond" data-ev="${e.id}" data-pl="${p.id}" data-v="absent" aria-pressed="${e.responses[p.id]==='absent'}" aria-label="Absent">A</button>`:statusPill(e.responses[p.id])}</div>`;
  const grpBlock=(k,lbl,color)=>`<div class="section"><div class="label" style="color:${color}">${lbl} · <span class="num">${grp[k].length}</span></div>${grp[k].length?`<div class="list">${grp[k].map(plRow).join('')}</div>`:'<div class="muted" style="font-size:14px">Personne</div>'}</div>`;
  root.innerHTML=`<div class="overlay" data-a="close-sheet"><div class="panel" role="dialog" aria-modal="true" aria-label="${esc(e.title)}">
    <div class="panel-head"><div style="min-width:0"><div class="row" style="gap:6px;margin-bottom:6px">${scopeChip(e)}${st==='live'?'<span class="live-tag">En direct</span>':st==='done'?'<span class="chip">Terminé</span>':st==='started'?'<span class="chip">Commencé</span>':'<span class="chip">À venir</span>'}</div>
      <h2>${esc(e.title)}</h2>${e.subtitle?`<div class="muted">${esc(e.subtitle)}</div>`:''}</div>
      <button class="x" data-a="close-sheet" aria-label="Fermer">✕</button></div>
    <div class="panel-body">
      <div class="card row" style="justify-content:space-between"><div><div class="label">Début</div><div style="font-weight:600;text-transform:capitalize">${fDayLong(e.start)} · ${fTime(e.start)}</div></div>
        ${manage?`<div class="row"><button class="btn small" data-a="ev-edit" data-id="${e.id}">Modifier</button><button class="btn small danger" data-a="ev-del" data-id="${e.id}" data-confirm>Supprimer</button>${e.seriesId&&S.events.some(x=>x.seriesId===e.seriesId&&x!==e&&new Date(x.start)>new Date(e.start))?`<button class="btn small danger" data-a="ev-del-series" data-id="${e.id}" data-confirm>Supprimer la série</button>`:''}</div>`:''}</div>
      ${e.seriesId?`<div class="muted" style="font-size:13px;margin-top:-8px">↻ Répété ${REP_LBL[e.repeat]||''} · ${S.events.filter(x=>x.seriesId===e.seriesId).length} événements dans la série. « Supprimer la série » retire celui-ci et les suivants.</div>`:''}
      ${(st!=='up'||e.live.status!=='none')?boardHtml(e,manage):''}
      ${e.askPresence?`<div class="section"><div class="spread"><h3 style="font-size:20px">Présences</h3><span class="muted num" style="font-size:14px">${conv.length} convoqué${conv.length>1?'s':''}</span></div>${presenceBar(e)}</div>
        ${grpBlock('present','Présents','var(--present)')}${grpBlock('absent','Absents','var(--absent)')}${grpBlock('none','Pas répondu','var(--pending)')}`
        :`<div class="section"><h3 style="font-size:20px">Convoqués · <span class="num">${conv.length}</span></h3>${conv.length?`<div class="list">${conv.map(p=>`<div class="item">${av(fullName(p))}<div class="grow name">${esc(fullName(p))}</div></div>`).join('')}</div>`:'<div class="muted">Aucun joueur convoqué.</div>'}<div class="muted" style="font-size:13px">Aucune réponse de présence demandée pour cet événement.</div></div>`}
    </div></div></div>`;
}
function boardHtml(e,manage){
  const st=evStatus(e),t=team(e.teamId);
  if(st==='started'&&e.live.status==='none'){
    return manage?`<div class="board"><div class="head"><span>LIVE</span><span>${esc(e.opponent||'Adversaire')}</span></div><div style="text-align:center">L'événement a commencé. Lancez le live pour suivre le score en temps réel.</div><div class="foot"><button class="btn live" data-a="live-start" data-id="${e.id}">Lancer le live</button></div></div>`:'';
  }
  const ctl=(side)=>manage&&st==='live'?`<div class="ctl"><button data-a="score" data-id="${e.id}" data-side="${side}" data-d="-1" aria-label="Retirer un point">−</button><button data-a="score" data-id="${e.id}" data-side="${side}" data-d="1" aria-label="Ajouter un point">+</button></div>`:'';
  return `<div class="board" aria-live="polite">
    <div class="head"><span class="row" style="gap:8px"><span class="board-ic">${sportIcon()}</span>${st==='live'?'<span class="live-tag">En direct</span>':'Score final'}</span>${st==='live'?`<span class="clock num">${elapsed(e)}'</span>`:''}</div>
    <div class="teams">
      <div class="side"><span class="tn">${esc(S.club.short)} ${esc(scopeName(e))}</span><span class="digits">${e.live.us}</span>${ctl('us')}</div>
      <span class="sep">–</span>
      <div class="side"><span class="tn">${esc(e.opponent||'Adversaire')}</span><span class="digits">${e.live.them}</span>${ctl('them')}</div>
    </div>
    ${manage?`<div class="foot">${st==='live'?`<button class="btn small" data-a="live-end" data-id="${e.id}" data-confirm>Fin du match</button>`:`<button class="btn small" data-a="live-reopen" data-id="${e.id}">Reprendre le live</button>`}</div>`:''}
  </div>`;
}

/* ---------- Onglet LIVE ---------- */
function liveView(){
  const evs=visibleEvents();
  const live=evs.filter(e=>evStatus(e)==='live');
  const started=evs.filter(e=>evStatus(e)==='started'&&!isPast(e));
  const today=evs.filter(e=>evStatus(e)==='up'&&dayKey(e.start)===dayKey(new Date()));
  const recent=evs.filter(e=>evStatus(e)==='done').sort((a,b)=>new Date(b.start)-new Date(a.start)).slice(0,3);
  return `<div class="stack">
    ${pageTitle('Live',I.live,'#FF5A1F',live.length?`${live.length} match${live.length>1?'s':''} en cours`:'Scores en direct')}
    ${live.length?live.map(e=>`<div class="section"><div class="spread"><div><div class="title" style="font-family:var(--f-display);font-weight:700;font-size:19px">${esc(e.title)}</div><div class="muted" style="font-size:14px">${esc(e.subtitle)}</div></div><button class="btn small" data-a="open-ev" data-id="${e.id}">Détails</button></div>${boardHtml(e,canManageEv(e))}</div>`).join('')
      :emptyBox(I.live,'Aucun match en cours.<br>Le score s\'affiche ici dès qu\'un coach lance le live.')}
    ${started.length?`<div class="section"><div class="label">Commencés, live non lancé</div>${started.map(evCard).join('')}</div>`:''}
    ${today.length?`<div class="section"><div class="label">Plus tard aujourd'hui</div>${today.map(evCard).join('')}</div>`:''}
    ${recent.length?`<div class="section"><div class="label">Derniers résultats</div>${recent.map(evCard).join('')}</div>`:''}
  </div>`;
}

/* ---------- Modale générique ---------- */
let modalSubmit=null;
function openModal(title,body,label,onSubmit){
  modalSubmit=onSubmit;
  document.getElementById('modal').innerHTML=`<div class="overlay" data-a="close-modal"><div class="panel" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="panel-head"><h2>${esc(title)}</h2><button class="x" type="button" data-a="close-modal" aria-label="Fermer">✕</button></div>
    <form id="modalForm" class="panel-body">${body}<div class="err" id="modalErr" hidden></div><button class="btn primary block" type="submit">${esc(label)}</button></form></div></div>`;
  const f=document.querySelector('#modalForm .input');if(f)f.focus();
}
const closeModal=()=>{document.getElementById('modal').innerHTML='';modalSubmit=null};
const checks=(name,items,selected)=>items.length?`<div class="checks">${items.map(([v,l])=>`<label><input type="checkbox" name="${name}" value="${v}" ${selected.includes(v)?'checked':''}>${esc(l)}</label>`).join('')}</div>`:'<div class="muted" style="font-size:14px">Rien à sélectionner.</div>';

const MAX_OCC=200;
function occurrences(startISO,rep,untilStr){
  const s=new Date(startISO);if(rep==='none'||!rep)return [s];
  const until=new Date(untilStr+'T23:59:59');const out=[];
  for(let i=0;i<MAX_OCC;i++){
    let d=new Date(s);
    if(rep==='week')d.setDate(s.getDate()+7*i);
    else if(rep==='2week')d.setDate(s.getDate()+14*i);
    else{const m=s.getMonth()+i,y=s.getFullYear()+Math.floor(m/12),mm=((m%12)+12)%12,last=new Date(y,mm+1,0).getDate();d=new Date(y,mm,Math.min(s.getDate(),last),s.getHours(),s.getMinutes())}
    if(d>until)break;out.push(d);
  }
  return out;
}
const REP_LBL={week:'chaque semaine','2week':'toutes les 2 semaines',month:'chaque mois'};
function updateRepeatHint(){
  const r=document.getElementById('evRepeat');if(!r)return;
  const on=r.value!=='none',w=document.getElementById('evUntilWrap'),h=document.getElementById('evRepeatHint');
  w.hidden=!on;h.hidden=!on;if(!on)return;
  const st=document.getElementById('evStart').value,u=document.getElementById('evUntil').value;
  if(!st||!u){h.textContent='Choisissez une date de fin.';return}
  const n=occurrences(new Date(st).toISOString(),r.value,u).length;
  h.textContent=n?`${n} événement${n>1?'s':''} ser${n>1?'ont':'a'} créé${n>1?'s':''}, ${REP_LBL[r.value]}, du ${fDayShort(new Date(st))} au ${fDayShort(new Date(u+'T12:00'))}.${n>=MAX_OCC?' (limité à '+MAX_OCC+')':''}`:'La date de fin est avant la date de début.';
}
function eventForm(e){
  const teams=S.teams.filter(t=>canManage(t.id));
  const tid=e?(e.teamId||CLUB):(ui.teamFilter==='club'?CLUB:ui.teamFilter!=='all'&&canManage(ui.teamFilter)?ui.teamFilter:teams[0]?.id||CLUB);
  const d=new Date();d.setDate(d.getDate()+1);d.setHours(18,0,0,0);
  openModal(e?"Modifier l'événement":'Nouvel événement',`
    <label class="field"><span>Concerne</span><select class="input" id="evTeam" name="team">${teams.map(t=>`<option value="${t.id}" ${t.id===tid?'selected':''}>Équipe ${esc(t.name)}</option>`).join('')}<option value="${CLUB}" ${tid===CLUB?'selected':''}>Tout le club</option></select></label>
    <div class="muted" id="evScopeHint" style="font-size:13px;margin-top:-8px" ${tid===CLUB?'':'hidden'}>Visible par tous les membres et parents du club. Tous les joueurs sont convoqués par défaut, décochez ceux qui ne sont pas concernés.</div>
    <div class="field"><span>Titre</span>
      ${S.titles.length?`<div class="row" style="gap:6px">${S.titles.map(t=>`<button type="button" class="chip pick" data-a="pick-title" data-v="${esc(t)}" aria-pressed="${e&&e.title===t}">${esc(t)}</button>`).join('')}</div>`:''}
      <input class="input" id="evTitle" name="title" required value="${esc(e?.title||'')}" placeholder="Choisissez un titre ci-dessus ou saisissez le vôtre" aria-label="Titre">
      ${isAdmin()?`<label class="toggle" style="font-weight:500;font-size:14px"><input type="checkbox" id="evSaveTitle" name="saveTitle"> Ajouter ce titre à la liste des titres prédéfinis</label>`:''}
    </div>
    <label class="field"><span>Sous-titre</span><input class="input" id="evSub" name="subtitle" value="${esc(e?.subtitle||'')}" placeholder="contre l’adversaire – Journée 5"></label>
    <div class="grid2"><label class="field"><span>Date et heure de début</span><input class="input" id="evStart" type="datetime-local" name="start" required value="${toLocalInput(e?e.start:d)}"></label>
    <label class="field"><span>Adversaire (pour le live)</span><input class="input" id="evOpp" name="opponent" value="${esc(e?.opponent||'')}" placeholder="Facultatif"></label></div>
    ${!e?`<div class="grid2"><label class="field"><span>Répétition</span><select class="input" id="evRepeat" name="repeat">
        <option value="none">Ne pas répéter</option><option value="week">Chaque semaine</option><option value="2week">Toutes les 2 semaines</option><option value="month">Chaque mois</option></select></label>
      <label class="field" id="evUntilWrap" hidden><span>Jusqu'au (inclus)</span><input class="input" id="evUntil" type="date" name="until" value="${toLocalInput(new Date(d.getTime()+60*864e5)).slice(0,10)}"></label></div>
      <div class="muted" id="evRepeatHint" style="font-size:13px;margin-top:-8px" hidden></div>`
    :e.seriesId?`<label class="toggle" style="font-weight:500"><input type="checkbox" id="evSeries" name="series"> Appliquer aussi aux événements suivants de la série (${S.events.filter(x=>x.seriesId===e.seriesId&&new Date(x.start)>new Date(e.start)).length})</label>`:''}
    <label class="toggle"><input type="checkbox" id="evAsk" name="ask" ${!e||e.askPresence?'checked':''}> Demander la présence aux parents</label>
    <div class="field"><span>Joueurs convoqués</span><div id="convBox">${convChecks(tid,e?e.convoked:null)}</div></div>
  `,e?'Enregistrer':"Créer l'événement",f=>{
    const fd=new FormData(f),title=fd.get('title').trim(),start=fd.get('start');
    if(!title)return 'Indiquez un titre.';if(!start)return 'Indiquez la date et l\'heure de début.';
    if(fd.get('saveTitle')&&!S.titles.some(t=>low(t)===low(title)))S.titles.push(title);
    const data={title,subtitle:fd.get('subtitle').trim(),opponent:fd.get('opponent').trim(),start:new Date(start).toISOString(),askPresence:!!fd.get('ask'),convoked:fd.getAll('conv')};
    const scope=fd.get('team');data.teamId=scope===CLUB?null:scope;
    const clean=x=>Object.keys(x.responses).forEach(k=>{if(!x.convoked.includes(k))delete x.responses[k]});
    if(e){
      const oldStart=new Date(e.start),nd=new Date(data.start);
      if(fd.get('series')){
        const next=S.events.filter(x=>x.seriesId===e.seriesId&&x!==e&&new Date(x.start)>oldStart);
        next.forEach(x=>{const t=new Date(x.start);t.setHours(nd.getHours(),nd.getMinutes(),0,0);Object.assign(x,{...data,start:t.toISOString(),convoked:[...data.convoked]});clean(x)});
        Object.assign(e,data);clean(e);toast(`${next.length+1} événements mis à jour`);
      }else{Object.assign(e,data);clean(e);toast('Événement mis à jour')}
    }else{
      const rep=fd.get('repeat')||'none';
      if(rep!=='none'&&!fd.get('until'))return 'Indiquez la date de fin de la répétition.';
      const dates=occurrences(data.start,rep,fd.get('until'));
      if(!dates.length)return 'La date de fin est avant la date de début.';
      const seriesId=dates.length>1?uid():null;
      dates.forEach(dt=>S.events.push({id:uid(),createdBy:me.id,responses:{},live:{status:'none',us:0,them:0},...data,convoked:[...data.convoked],start:dt.toISOString(),...(seriesId?{seriesId,repeat:rep}:{})}));
      toast(dates.length>1?`${dates.length} événements créés`:'Événement créé');
    }
  });
}
const convChecks=(tid,sel)=>{
  if(tid!==CLUB){const ps=teamPlayers(tid);return checks('conv',ps.map(p=>[p.id,fullName(p)]),sel||ps.map(p=>p.id))}
  const ps=S.teams.flatMap(t=>teamPlayers(t.id));
  return checks('conv',ps.map(p=>[p.id,`${fullName(p)} · ${team(p.teamId).name}`]),sel||ps.map(p=>p.id));
};

  });

          const fd=new FormData(f);k.birth=fd.get('birth');setPhone(k,fd.get('phone'));parentCall('parent_update',{p_player:k.id,p_birth:k.birth||null,p_phone:fd.get('phone')||''});toast('Informations mises à jour')});break}
    case 'kid-ok':{const p=player(d.id);const b=document.getElementById('v-birth-'+p.id),ph=document.getElementById('v-phone-'+p.id);
      if(b&&b.value)p.birth=b.value;if(ph)setPhone(p,ph.value);setLink(p.id,'ok');parentCall('parent_link',{p_player:p.id,p_state:'ok',p_birth:p.birth||null,p_phone:ph?ph.value:null});ui.tab='cal';render();toast(`${p.first} est rattaché(e) à votre compte`);break}
    case 'pick-title':{const inp=document.getElementById('evTitle');inp.value=d.v;document.querySelectorAll('.chip.pick').forEach(c=>c.setAttribute('aria-pressed',c===el));inp.focus();break}
    case 'title-new':case 'title-edit':{const i=a==='title-edit'?Number(d.i):-1;
      openModal(i<0?'Nouveau titre':'Renommer le titre',`<label class="field"><span>Titre</span><input class="input" id="ttName" name="name" required value="${esc(i<0?'':S.titles[i])}" placeholder="Plateau U9"></label>`,i<0?'Ajouter':'Enregistrer',f=>{
        const v=new FormData(f).get('name').trim();if(!v)return 'Indiquez un titre.';
        if(S.titles.some((t,j)=>j!==i&&low(t)===low(v)))return 'Ce titre existe déjà.';
        if(i<0)S.titles.push(v);else S.titles[i]=v;toast(i<0?'Titre ajouté':'Titre renommé')});break}
    case 'title-del':S.titles.splice(Number(d.i),1);save();render();toast('Titre supprimé');break;
    case 'title-move':{const i=Number(d.i),j=i+Number(d.d);if(j<0||j>=S.titles.length)break;[S.titles[i],S.titles[j]]=[S.titles[j],S.titles[i]];save();render();break}
    case 'kid-no':setLink(d.id,'no');parentCall('parent_link',{p_player:d.id,p_state:'no'});render();toast('Le club sera informé');break;
  }
}

document.addEventListener('click',ev_=>{
  const el=ev_.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a;
  if((a==='close-sheet'||a==='close-modal')&&el.classList.contains('overlay')&&ev_.target!==el)return;
  if(el.tagName==='SELECT')return;
  if(el.hasAttribute('data-confirm')&&!el.dataset.armed){
    el.dataset.armed='1';const old=el.textContent;el.textContent='Confirmer ?';
    setTimeout(()=>{if(el.isConnected){delete el.dataset.armed;el.textContent=old}},3000);return}
  if(a==='respond'||a==='score')ev_.stopPropagation();
  act(a,el.dataset,el);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(document.getElementById('modal').innerHTML)closeModal();else if(ui.sheet){ui.sheet=null;renderSheet()}}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('.ev[data-a]')){e.preventDefault();act('open-ev',e.target.dataset)}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='teamFilter'){ui.teamFilter=t.value;render()}
  else if(t.dataset.a==='player-move'){const p=player(t.dataset.id);p.teamId=t.value||null;save();render();toast(`${p.first} → ${p.teamId?team(p.teamId).name:'sans équipe'}`)}
  else if(['evRepeat','evUntil','evStart'].includes(t.id)){updateRepeatHint()}
  else if(t.name==='sport'&&t.type==='radio'){document.getElementById('clOtherWrap').hidden=t.value!=='autre'}
  else if(t.id==='evTeam'){document.getElementById('convBox').innerHTML=convChecks(t.value,null);document.getElementById('evScopeHint').hidden=t.value!==CLUB}
});
document.addEventListener('input',e=>{if(['evStart','evUntil'].includes(e.target.id))updateRepeatHint();if(e.target.id==='evTitle')document.querySelectorAll('.chip.pick').forEach(c=>c.setAttribute('aria-pressed',c.dataset.v===e.target.value))});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target;
  if(f.id==='loginForm'){if(ui.loginMode==='password')loginPassword(f.email.value,f.password.value);else login(f.email.value);return}
  if(f.id==='passForm'){changePassword(f);return}
  if(f.id==='otpForm'){if(f.code.value.trim())verifyCode(f.code.value);return}
  if(f.id==='modalForm'&&modalSubmit){const err=modalSubmit(f);const box=document.getElementById('modalErr');
    if(err){box.textContent=err;box.hidden=false;return}closeModal();save();render()}
});
// horloge du live
setInterval(()=>{if(me&&visibleEvents().some(e=>evStatus(e)==='live')&&!document.getElementById('modal').innerHTML)render()},30000);
boot();
</script>
